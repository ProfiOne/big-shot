    document.addEventListener("DOMContentLoaded", () => {
        const overlay = document.getElementById("intro-overlay");
        const displayTime = 2000; 

        setTimeout(() => {
            // Включаем плавное исчезновение (CSS transition)
            overlay.classList.add("fade-out");
            
            // Полностью удаляем элемент из HTML после завершения CSS-анимации (через 500мс)
            setTimeout(() => {
                overlay.remove();
            }, 500);
            
            // Запоминаем, что анимация уже была показана
            sessionStorage.setItem("introShown", "true");
        }, displayTime);
    });

<script>
    function validatePassword(password) {
        const rules = [
            { id: "digit", label: "Пароль должен содержать хотя бы одну цифру", check: (p) => /\d/.test(p) },
            { id: "special", label: "Пароль должен содержать хотя бы один специальный символ", check: (p) => /[!@#$%^&*(),.?":{}|<>]/.test(p) },
            { id: "sponsor", label: "Пароль должен содержать одного из наших спонсоров: Папич, Монолит, Бетон, Император, Пиво, ДядяБогдан, Паравозик, Пельмень, Спамтон", check: (p) => /(Папич|Монолит|Бетон|Император|Пиво|ДядяБогдан|Паравозик|Пельмень|Спамтон)/i.test(p) },
            { id: "length", label: "Пароль должен быть не менее 47 символов", check: (p) => p.length >= 47 },
            { id: "roman", label: "Пароль должен содержать хотя бы одну римскую цифру", check: (p) => /[IVXLCDM]/i.test(p) },
            { id: "beton", label: "Пароль должен содержать слово 'бетон'", check: (p) => /бетон/i.test(p) },
            { id: "math", label: "Пароль должен содержать сумму 25+22", check: (p) => {
                const numbers = p.match(/\d+/g);
                if (!numbers) return false;
                const sum = numbers.reduce((acc, num) => acc + parseInt(num, 10), 0);
                return sum === 47;
            }}
        ];

        const results = rules.map(rule => ({
            label: rule.label,
            valid: rule.check(password)
        }));

        const allValid = results.every(result => result.valid);

        return {
            isValid: allValid,
            errors: results.filter(result => !result.valid).map(result => result.label),
            details: results
        };
    }

    document.querySelector("form").addEventListener("submit", function(event) {
        event.preventDefault();
        const pwdInput = document.getElementById("password");
        const validation = validatePassword(pwdInput.value);
        if (!validation.isValid) {
            alert("Ошибки в пароле:\n" + validation.errors.join("\n"));
        } else {
            alert("Ладно, так уж и быть. Теперь ты собственность картеля.");
            window.location.href = "images/spamton-dance.gif";
        }
    });
</script>
