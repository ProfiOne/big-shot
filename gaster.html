<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Shot</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="images/SpamtonBase.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <meta name="description" content="Курс на корневую папку ребята!">
    <meta name="robots" content="index, follow">
    <meta name="keywords" content="Спамтон, Spamton, Big Shot, Meme, Мемы, Дельтарун, Deltarune">
    <meta name="theme-color" content="dark-theme">
    <link rel="canonical" href="http://profione.github.io/big-shot/gaster.html">
</head>
<body>
    <div id="intro-overlay">
        <img src="images/capcut.gif" alt="Загрузка...">
    </div>

    <div class="bg"></div>
    
    <header>   
        <nav>
            <div class="logo">
                <img src="images/SpamtonBase.webp" alt="">
                <a href="index.html">Спамтон</a>
            </div>
            <div class="nav-btns">
                <a href="index.html" class="btn-white">Главная</a>
                <a href="bio.html" class="btn-white">Биография</a>
                <a href="content.html" class="btn-white">Контент</a>
                <a href="not-index.html" class="btn-white">Регистрация</a>
            </div>
        </nav>
    </header>

    <img src="images/pirate.png" alt="" class="pirate">
    <img src="images/waves.jpg" alt="" class="waves">
    
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const overlay = document.getElementById("intro-overlay");
        const displayTime = 2000; 

        setTimeout(() => {
            // Включаем плавное исчезновение (CSS transition)
            overlay.classList.add("fade-out");
            
            // Полностью удаляем элемент из HTML после завершения CSS-анимации (через 500мс)
            setTimeout(() => {
                overlay.remove();
            }, 500);
            
            // Запоминаем, что анимация уже была показана
            sessionStorage.setItem("introShown", "true");
        }, displayTime);
    });
    </script>
</body>
</html>
